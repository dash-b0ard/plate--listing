<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Al Aweer Listing Checkout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap">
<style>
/* Layout: one listing shell for every stage — breadcrumb, horizontal stepper, main column of white panels on a light page,
   sticky right sidebar (live listing preview + publishing cost), sticky bottom action bar. Tokens follow the Al Aweer draft UI. */
:root{
  --page:#f6f7f6; --surface:#ffffff; --sunk:#f1f3f2; --line:#e7e9e8; --line-strong:#d6dad8;
  --fg:#1d1f1e; --muted:#6f7572; --faint:#9aa09d;
  --brand:#2fb673; --brand-ink:#ffffff; --brand-soft:#e8f7ef; --brand-text:#1f8f57;
  --chip-on:#1d1f1e; --chip-on-ink:#ffffff;
  --warn:#e9a23b; --warn-soft:#fff6e8; --warn-text:#a86a10;
  --bad:#e0383e; --bad-soft:#fdecec; --info:#2563eb;
  --demo:#14171a; --demo-ink:#e9ecea; --demo-muted:#9aa3a0;
  --font:"Lato",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --shadow:0 1px 2px rgba(20,30,25,.05),0 6px 24px rgba(20,30,25,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#0f1211; --surface:#181c1a; --sunk:#1f2421; --line:#2b312e; --line-strong:#3a423e;
  --fg:#eef1ef; --muted:#a3aba7; --faint:#77807c;
  --brand:#34c27d; --brand-ink:#06150d; --brand-soft:#173526; --brand-text:#5ad79a;
  --chip-on:#eef1ef; --chip-on-ink:#111413;
  --warn:#f0b04f; --warn-soft:#2f2615; --warn-text:#f0b04f; --bad:#ff5d62; --bad-soft:#3a1d1e; --info:#7aa7ff;
  --demo:#0a0c0b; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --page:#0f1211; --surface:#181c1a; --sunk:#1f2421; --line:#2b312e; --line-strong:#3a423e;
  --fg:#eef1ef; --muted:#a3aba7; --faint:#77807c;
  --brand:#34c27d; --brand-ink:#06150d; --brand-soft:#173526; --brand-text:#5ad79a;
  --chip-on:#eef1ef; --chip-on-ink:#111413;
  --warn:#f0b04f; --warn-soft:#2f2615; --warn-text:#f0b04f; --bad:#ff5d62; --bad-soft:#3a1d1e; --info:#7aa7ff;
  --demo:#0a0c0b; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}

/* Demo bar */
.demo{background:var(--demo);color:var(--demo-ink);font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:10px}
.demo b{font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--demo-muted)}
.demo label{display:flex;align-items:center;gap:6px;color:var(--demo-muted)}
.demo select,.demo .dbtn{background:#22272a;border:1px solid #33393d;color:var(--demo-ink);border-radius:6px;padding:4px 8px;font-size:13px}
.demo .dbtn:hover{border-color:var(--brand)}
.demo .sp{flex:1}

/* Header */
header.site{border-bottom:1px solid var(--line);background:var(--surface)}
header.site .wrap{display:flex;align-items:center;gap:24px;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.logo .mark{width:40px;height:40px;border:2.5px solid var(--fg);border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:12px}
.logo .t{display:flex;flex-direction:column;line-height:1.15}
.logo .ar{font-weight:700;font-size:15px}
.logo .en{font-size:13px;color:var(--muted)}
nav.main{display:flex;gap:22px;font-size:15px}
nav.main span{display:flex;align-items:center;gap:4px}
.hdr-sp{flex:1}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:900;font-size:13px;position:relative}
.avatar i{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:var(--info);border:2px solid var(--surface)}
.user .nm{font-size:14px;line-height:1.2}
.user .vf{font-size:12px;color:var(--info)}
@media (max-width:980px){ nav.main{display:none} }
@media (max-width:560px){ .user .t2,.hdr-new,.logo .en{display:none} }

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-sm);padding:11px 18px;font-weight:700;font-size:15px;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{filter:brightness(.95)}
.btn-primary[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn-ghost{background:var(--sunk);color:var(--fg)}
.btn-ghost:hover{background:var(--line)}
.btn-outline{background:var(--surface);border-color:var(--line-strong);color:var(--fg)}
.btn-outline:hover{border-color:var(--fg)}
.btn-outline[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:7px}
.btn-link{background:none;border:0;color:var(--brand-text);font-weight:700;padding:0}

/* ===== The shell ===== */
main{padding-block:22px 0}
.flow{max-width:1180px;margin:0 auto}
.crumbs{display:flex;gap:6px;font-size:13px;color:var(--faint);flex-wrap:wrap;margin-bottom:16px}
.crumbs b{color:var(--fg);font-weight:400}
.steps{list-style:none;margin:0 0 26px;padding:16px 20px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto}
.steps li{display:flex;align-items:center;gap:10px;flex:1;min-width:max-content;font-size:14px;color:var(--muted)}
.steps li:last-child{flex:none}
.steps .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid var(--line-strong);background:var(--surface);color:var(--muted);flex:none}
.steps .line{flex:1;height:2px;background:var(--line);min-width:16px}
.steps li.done .dot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.steps li.done .line{background:var(--brand)}
.steps li.cur .dot{border-color:var(--brand);color:var(--brand-text);box-shadow:0 0 0 4px var(--brand-soft)}
.steps li.cur{color:var(--fg);font-weight:700}
.steps .sub{font-weight:400;color:var(--muted);font-size:12px;display:block;line-height:1.1}
.steps-mob{display:none}
@media (max-width:760px){
  .steps{display:none}
  .steps-mob{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:18px;font-size:14px}
  .steps-mob .bars{display:flex;gap:4px}
  .steps-mob .bars span{width:18px;height:5px;border-radius:3px;background:var(--line)}
  .steps-mob .bars span.on{background:var(--brand)}
}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
@media (max-width:980px){ .grid{grid-template-columns:1fr} }
.mainc{display:flex;flex-direction:column;gap:16px;min-width:0}
.tb h1{font-size:24px;font-weight:700;margin:0;text-wrap:balance}
.tb p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.tb{margin-bottom:4px}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}
@media (max-width:980px){ .side{position:static} }
.bar{position:sticky;bottom:0;z-index:20;margin-top:28px;padding-bottom:env(safe-area-inset-bottom,0px)}
.bar-in{max-width:1180px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -6px 24px rgba(20,30,25,.07);padding:14px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar-in .sp{flex:1}
.bar-in .note{font-size:13px;color:var(--muted)}
@media (max-width:620px){ .bar-in{padding:12px;flex-wrap:nowrap} .bar-in .hide-sm,.bar-in [data-act=cancel],.bar-in .sp{display:none} .bar-in .btn{padding:11px 14px} .bar-in .btn-primary{flex:1;white-space:normal;text-align:center} }
@media (max-width:560px){ .hdr-new{display:none!important} }
@media (min-width:981px){ .side{max-height:calc(100vh - 120px);overflow:auto;scrollbar-width:thin} }
.side>*{flex:none}
.pv.compact .cmp{display:flex;align-items:stretch}
.pv.compact .media{width:128px;flex:none;aspect-ratio:auto;min-height:104px}
.pv.compact .price{font-size:17px}
.pv.compact .ttl{font-size:14px}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.panel>.ph{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel>.ph h2{font-size:17px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.panel>.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.panel>.pb{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.panel.err-p{border-color:var(--bad)}

/* Fields */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:620px){ .two,.three{grid-template-columns:1fr} }
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lbl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.lock{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--faint)}
.ctl{position:relative;display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);min-height:50px}
.ctl:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.ctl input,.ctl select,.ctl textarea{flex:1;min-width:0;border:0;background:transparent;padding:13px 16px;outline:none;font-size:15px}
.ctl select{appearance:none;padding-right:40px;cursor:pointer}
.ctl select.ph{color:var(--faint)}
.ctl select:disabled{cursor:not-allowed;opacity:.6}
.ctl .chev{position:absolute;right:16px;pointer-events:none;color:var(--muted)}
.ctl .unit{padding-right:16px;font-size:13px;color:var(--muted);font-weight:700}
.ctl textarea{resize:vertical;min-height:130px}
.ctl.err{border-color:var(--bad)}
.errmsg{color:var(--bad);font-size:13px}
.hint{color:var(--muted);font-size:13px}
.counter{color:var(--faint);font-size:12px;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chip:hover{border-color:var(--fg)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip .sw{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.chips.err .chip{border-color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--brand-soft);color:var(--brand-text)}
.pill.warn{background:var(--warn-soft);color:var(--warn-text)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--sunk);color:var(--muted)}

/* Photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ptile{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.ptile img{width:100%;height:100%;object-fit:cover;display:block}
.ptile .del{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:8px;border:0;background:rgba(20,22,21,.62);color:#fff;display:grid;place-items:center}
.ptile .main{position:absolute;left:6px;right:6px;bottom:6px;border:0;border-radius:8px;background:rgba(20,22,21,.62);color:#fff;font-size:12px;padding:5px}
.ptile .main.is{background:var(--brand);color:var(--brand-ink)}
.addph{border:1.5px dashed var(--line-strong);border-radius:var(--r);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:13px;background:var(--surface);text-align:center;padding:8px}
.addph:hover{border-color:var(--brand);color:var(--brand-text)}
.addph.err{border-color:var(--bad)}
.photomtr{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1;max-width:220px}
.meter i{display:block;height:100%;background:var(--brand);border-radius:3px}
.meter.low i{background:var(--warn)} .meter.out i{background:var(--bad)}

/* Option rows (features, services, choices) */
.opt{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px;background:var(--surface)}
.opt .grow{flex:1;min-width:0}
.opt .t{font-size:15px}
.opt .s{font-size:13px;color:var(--muted)}
.opt .prev{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt .prev span{font-size:12px;background:var(--sunk);border-radius:999px;padding:3px 9px}
.inline-note{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:var(--r-sm);padding:10px 14px}
.inline-note svg{flex:none}
.notice{background:var(--warn-soft);border-radius:var(--r);padding:14px 16px;font-size:14px;color:var(--muted);display:flex;gap:12px}
.notice b{color:var(--fg);display:block;margin-bottom:2px}
.notice svg{color:var(--warn);flex:none;margin-top:2px}
.switch{position:relative;width:42px;height:24px;flex:none;border-radius:999px;background:var(--line-strong);border:0;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(18px)}
.choice{display:flex;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--surface);text-align:left;width:100%}
.choice:hover{border-color:var(--line-strong)}
.choice.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:grid;place-items:center}
.on>.radio,.radio.on{border-color:var(--brand)}
.on>.radio::after,.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.choice .ic{width:42px;height:42px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;flex:none}
.choice .grow{flex:1;min-width:0}
.choice .t{font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.choice .s{font-size:13px;color:var(--muted)}
.choice ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.choice .c{text-align:right;font-size:15px;white-space:nowrap}
.choice .c small{display:block;font-size:12px;color:var(--muted)}
@media (max-width:540px){ .choice{flex-wrap:wrap} .choice .c{width:100%;text-align:left;padding-left:34px} .choice .ic{display:none} }

/* Kind cards */
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){ .kinds{grid-template-columns:1fr} }
.kind{border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:20px;text-align:left;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,box-shadow .15s}
.kind:hover:not([disabled]){border-color:var(--brand);box-shadow:var(--shadow)}
.kind[disabled]{opacity:.55;cursor:not-allowed}
.kind .art{height:110px;border-radius:var(--r);background:var(--sunk);display:grid;place-items:center;overflow:hidden;padding:0 12px}
.kind h2{font-size:18px;margin:0}
.kind p{margin:0;color:var(--muted);font-size:14px}
.kind .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line);font-size:13px}
.kind .go{color:var(--brand-text);font-weight:700;display:flex;align-items:center;gap:4px}

/* Sidebar: preview + cost */
.pv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.pv .lab{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
.pv .media{aspect-ratio:16/10;background:var(--sunk);display:grid;place-items:center;color:var(--faint);font-size:13px;overflow:hidden}
.pv .media img{width:100%;height:100%;object-fit:cover;display:block}
.pv .bd{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.pv .price{font-size:20px;font-weight:900}
.pv .ttl{font-size:15px}
.pv .empty{color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.li{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-block:6px}
.li .k{font-size:14px}
.li .k small{display:block;font-size:12px;color:var(--muted)}
.li .v{text-align:right;white-space:nowrap;font-size:14px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tot{border-top:1px dashed var(--line-strong);padding-top:8px}
.tot .li{padding-block:3px;color:var(--muted)}
.tot .li .v{color:var(--fg)}
.due{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.due .k{color:var(--muted)}
.due .v{font-size:28px;font-weight:300}
.due .v small{font-size:13px;color:var(--muted);margin-left:4px}
.fine{font-size:12px;color:var(--muted);margin:0}
.arrow{display:inline-flex;gap:6px;align-items:center;font-weight:700}
.arrow s{text-decoration:none;color:var(--faint);font-weight:400}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){ .wgrid{grid-template-columns:1fr} }
.wcard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.wcard .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.wcard .v{font-size:13px;color:var(--muted)}
.wcard .v b{font-size:20px;color:var(--fg);font-weight:900;margin-right:2px}
.wcard .meter{max-width:none}
.wrow{display:flex;align-items:center;gap:10px;font-size:14px;padding-block:4px}
.wrow .k{flex:1}
.wrow .meter{max-width:90px}
.sublbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.divider{height:1px;background:var(--line);margin-block:4px}
.rv{display:flex;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0;padding-bottom:0}
.rv:first-child{padding-top:0}
.rv .k{font-size:14px;font-weight:700}
.rv .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.rv .grow{flex:1;min-width:0}

/* Plate */
.plate-stage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 16px;background:var(--sunk);border-radius:var(--r)}
.plate{display:flex;align-items:stretch;background:#fff;color:#111;border:3px solid #111;border-radius:10px;height:84px;width:330px;max-width:100%;box-shadow:0 2px 0 rgba(0,0,0,.15);overflow:hidden;font-family:var(--font)}
.plate .code{min-width:70px;display:flex;align-items:center;justify-content:center;padding:0 10px;font-weight:900;font-size:34px;line-height:1}
.plate .em{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 8px;font-size:10px;font-weight:900;letter-spacing:.1em;line-height:1.3;text-align:center}
.plate .em .a{font-size:13px;letter-spacing:0}
.plate .n{flex:1;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;letter-spacing:.06em;padding:0 12px;font-variant-numeric:tabular-nums}
.plate .ph-n{color:#c4c4c4}
.plate.moto{flex-direction:column;height:auto;width:180px}
.plate.moto .top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111;padding:4px 10px}
.plate.moto .code{font-size:24px;min-width:0;padding:0}
.plate.moto .n{font-size:40px;padding:6px 10px}
.plate.classic{background:#111;color:#f3f3f3;border-color:#555}
.plate.sm{width:100%;max-width:280px;height:62px;border-width:2px}
.plate.sm .code{font-size:24px;min-width:44px;padding:0 6px}
.plate.sm .n{font-size:30px;padding:0 8px}
.plate.sm .em{font-size:8px;padding:0 4px}
.plate.sm .em .a{font-size:10px}
.plate.moto.sm{width:130px;height:auto}
.plate.moto.sm .n{font-size:28px}

/* Result */
.res{text-align:center;padding:30px 22px 26px}
.res .badge{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px}
.res .badge.ok{background:var(--brand-soft);color:var(--brand)}
.res .badge.bad{background:var(--bad-soft);color:var(--bad)}
.res h2{margin:0;font-size:24px;font-weight:900}
.res h2.ok{color:var(--brand-text)} .res h2.bad{color:var(--bad)}
.res p{color:var(--muted);margin:6px auto 0;max-width:54ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;max-width:540px;margin:22px auto 0;text-align:left}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.timeline li{display:flex;gap:12px;font-size:14px}
.timeline .d{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:900;background:var(--sunk);color:var(--muted)}
.timeline .d.on{background:var(--brand);color:var(--brand-ink)}
.timeline small{display:block;color:var(--muted);font-size:13px}

/* Pay methods */
.pm .logo2{width:58px;height:38px;border-radius:7px;background:var(--sunk);display:grid;place-items:center;font-weight:900;font-size:13px;flex:none}
.pm .logo2.apple{background:#000;color:#fff}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(15,18,17,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{padding:20px 24px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal .mh h3{margin:0;font-size:20px;font-weight:700}
.modal .mh p{margin:3px 0 0;color:var(--muted);font-size:14px}
.modal .mb{padding:20px 24px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal .mf{padding:14px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.x{background:none;border:0;padding:4px;color:var(--fg)}
.emi{background:var(--sunk);border-radius:var(--r);padding:16px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.emi b{font-size:26px;font-weight:900}
.emi small{color:var(--muted)}
.rad{display:flex;gap:10px;align-items:center;background:none;border:0;padding:4px 0;font-size:15px}
.changes{padding-left:18px;margin:0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.changes span{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--page);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:var(--shadow)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);animation:sp .9s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spin{animation-duration:3s} *{transition:none!important} }
footer.site{background:#1d1f1e;color:#cfd3d1;font-size:13px;text-align:center;padding-block:22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

function emi(){const c=S.car,f=S.modal?.type==="finance"?S.modal.draft:c.finance;const price=+digits(c.price)||0;const loan=price*(1-(+f.dp||0)/100);const n=+f.months||1;const interest=loan*((+f.rate||0)/100)*(n/12);return {loan:Math.round(loan),emi:Math.round((loan+interest)/n)};}

/* ---------- Seller roles ----------
   One publish model for every seller type. A role defines:
   - billing: "credits" (subscription wallet, pay for what credits don't cover) or "pay" (pay per listing)
   - base(kind): the listing fee itself, or null when the price is inside the option
   - options(kind): the visibility choices shown on the Publish step; an option with a pool can be covered by a credit
   Service providers can be added later as another "pay" role with their own options. */
const ROLES = {
  dealer:{label:"Dealer",billing:"credits",
    base:k=>({key:k==="plate"?"plate":"car",name:k==="plate"?"Number plate listing":"Car listing",sub:`${DURATION_DAYS} days from approval`,price:DEALER_PRICE[k==="plate"?"plate":"car"],pool:k==="plate"?"plate":"car"}),
    options:k=>[
      {id:"standard",t:"Standard",ic:"none",pts:["Listed in search results by date"],price:0},
      {id:"featured",t:"Featured",ic:"star",pts:[`Ranked above Standard listings for ${BOOST_DAYS} days`],price:DEALER_PRICE.featured,pool:"featured",line:"Featured boost",lineSub:`${BOOST_DAYS} days`},
      {id:"premium",t:"Premium",ic:"gem",pts:[`Top tier: above Featured and in the homepage row for ${BOOST_DAYS} days`],price:DEALER_PRICE.premium,pool:"premium",line:"Premium boost",lineSub:`${BOOST_DAYS} days`}]},
  customer:{label:"Customer",billing:"pay",
    base:()=>null,
    options:k=>[
      {id:"standard",t:"Standard",ic:"none",pts:[k==="car"?"Shown to all verified dealers":"Public listing in Number plates",`Live for ${DURATION_DAYS} days`],price:CUSTOMER_PRICE.standard,line:"Standard listing",lineSub:`${DURATION_DAYS} days from approval`},
      {id:"premium",t:"Premium",ic:"gem",pts:[`Every dealer is notified about your ${k==="car"?"car":"plate"}`,`Premium boost: top of results for ${BOOST_DAYS} days`,`Live for ${DURATION_DAYS} days`],price:CUSTOMER_PRICE.premium,line:"Premium listing",lineSub:`${DURATION_DAYS} days · incl. premium boost`}]}
};
const role=()=>ROLES[S.seller];
function order(){
  const R=role(),W=S.wallet||{},lines=[];
  const item=(key,name,sub,price,pool)=>{const credit=R.billing==="credits"&&!!pool&&!!W[pool]&&W[pool].left>0;return {key:pool||key,name,sub,credit,amount:credit?0:price};};
  const b=R.base(S.kind); if(b) lines.push(item(b.key,b.name,b.sub,b.price,b.pool));
  const o=R.options(S.kind).find(x=>x.id===S.opt)||R.options(S.kind)[0];
  if(o.price>0) lines.push(item(o.id,o.line,o.lineSub,o.price,o.pool));
  const subtotal=lines.reduce((a,l)=>a+l.amount,0),vat=Math.round(subtotal*VAT*100)/100;
  return {lines,subtotal,vat,total:Math.round((subtotal+vat)*100)/100,credits:lines.filter(l=>l.credit)};
}

/* ---------- Shell ---------- */
const CAR_STEPS=[["Category"],["Basics"],["Photos & details"],["Specs"],["Features"],["Publish"]];
const PLATE_STEPS=[["Category"],["Plate"],["Price & details"],["Publish"]];
const GENERIC_STEPS=[["Category"],["Details"],["Publish"]];
function stepIndex(){ // 0-based index of current step in the stepper
  const steps=S.kind==="plate"?PLATE_STEPS:S.kind==="car"?CAR_STEPS:GENERIC_STEPS;
  if(S.screen==="start") return [steps,0,""];
  if(S.screen==="form") return [steps,S.step,""];
  const last=steps.length-1;
  if(S.screen==="checkout"||S.screen==="processing") return [steps,last,""];
  if(S.screen==="result") return [steps,S.result.ok?last+1:last,""];
}
function stepper(){
  const [steps,cur,sub]=stepIndex();
  const desk=`<ol class="steps" aria-label="Progress">${steps.map(([l],i)=>{const st=i<cur?"done":i===cur?"cur":"";
    return `<li class="${st}"${i===cur?' aria-current="step"':""}><span class="dot">${i<cur?I.tick:i+1}</span><span>${l}${i===cur&&sub?`<span class="sub">${sub}</span>`:""}</span>${i<steps.length-1?'<span class="line"></span>':""}</li>`;}).join("")}</ol>`;
  const shown=Math.min(cur,steps.length-1);
  const mob=`<div class="steps-mob"><span><b>${steps[shown][0]}</b>${sub?` · ${sub}`:""}</span><span style="display:flex;gap:10px;align-items:center;color:var(--muted)">${Math.min(cur+1,steps.length)} of ${steps.length}<span class="bars">${steps.map((_,i)=>`<span class="${i<=cur?"on":""}"></span>`).join("")}</span></span></div>`;
  return desk+mob;
}
function crumbs(){
  const tail = S.screen==="start"?"New listing":S.kind==="plate"?"Number plate":"Car";
  return `<div class="crumbs"><span>Home</span>›<span>${dealer()?"Dealer dashboard":"My listings"}</span>›${S.screen==="start"?`<b>${tail}</b>`:`<span>New listing</span>›<b>${tail}</b>`}</div>`;
}
function shell(title,desc,main,bar){
  return `<div class="flow">${crumbs()}${stepper()}
   <div class="grid"><div class="mainc"><div class="tb"><h1>${title}</h1>${desc?`<p>${desc}</p>`:""}</div>${main}</div>
   <aside class="side" id="side">${sidebar()}</aside></div>
   ${bar?`<div class="bar"><div class="bar-in">${bar}</div></div>`:'<div style="height:48px"></div>'}</div>`;
}
const P=(title,body,{sub="",right="",err=false}={})=>`<section class="panel${err?" err-p":""}"><div class="ph"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:""}</div>${right}</div><div class="pb">${body}</div></section>`;

function sidebar(){
  const d=dealer();
  if(S.screen==="start"){
    if(d && !S.wallet) return P("Subscription","<div class='hint'>You don't have an active subscription. Dealers need one to publish, and it includes your monthly listing and boost credits.</div><button class='btn btn-primary' data-act='noop'>View plans</button>");

    return P("Pricing",`<div class="li"><div class="k">Standard listing<small>${DURATION_DAYS} days</small></div><div class="v num">${aed(CUSTOMER_PRICE.standard)}</div></div><div class="li"><div class="k">Premium listing<small>Every dealer is notified + premium boost</small></div><div class="v num">${aed(CUSTOMER_PRICE.premium)}</div></div><p class="fine">Prices exclude VAT. Car listings are shown to verified dealers only. Plate listings are public.</p>`);
  }
  const o=order();
  if(S.screen==="form"){
    let cost;
    if(d && !S.wallet){ cost=`<div class="hint">No active subscription. Renew to publish; your draft is kept.</div>`; }
    else if(d){ const lp=listPool(),w=S.wallet[lp];
      cost = w.left>0 ? `<div class="li"><div class="k">Publishing uses<small>${w.left} of ${w.total} left this cycle</small></div><div class="v"><span>1 ${POOL_ONE[lp]}</span></div></div>`

    return preview()+P("Publishing cost",cost);
  }
  if(S.screen==="result"){ const r=S.result;

    return preview(st)+P(r.ok?"Payment summary":"Order summary",costLines(r)+`<div class="due"><span class="k">${r.ok?"Paid":"Due"}</span><span class="v num">${money(r.total)}<small>AED</small></span></div>`)

function viewCheckout(){
  const R=role(),W=S.wallet,o=order(),credits=R.billing==="credits",blocked=credits&&!W;
  const cost=opt=>{ if(credits&&opt.pool&&W&&W[opt.pool].left>0) return `Uses 1 credit<small>${W[opt.pool].left} left</small>`;
    if(opt.price===0) return `Included<small>&nbsp;</small>`; return `${aed(opt.price)}<small>${credits&&opt.pool?"No credits left · ":""}+ VAT</small>`; };
  const opts=R.options(S.kind);

  // 2. Visibility (same component for every role; options come from the role)

    {sub:credits?"Choose a tier for this listing":"Choose how you'd like to list"});
  // 3. Payment (credits block for credit roles, card block whenever something is due)
  let pay="";
  if(blocked){ pay=`<div class="notice">${I.info}<div><b>Your subscription isn't active</b>Renew or turn on auto-renew to publish. Your listing is saved as a draft. <button class="btn-link" data-act="noop">View plans</button></div></div>`; }
  else {
    if(credits){
      pay+=`<div class="sublbl">Credits · Dealer Pro, renews 1 Nov 2026</div>`+pools().map(k=>{const w=W[k],used=o.credits.some(l=>l.key===k),st=w.left===0?"out":w.left/w.total<=.2?"low":"";
        return `<div class="wrow"><span class="k">${POOL_NAME[k]}${used?` <span class="pill ok">Applied</span>`:""}</span><span class="meter ${st}"><i style="width:${w.left/w.total*100}%"></i></span><span class="num" style="min-width:74px;text-align:right">${used?`<span class="arrow"><s>${w.left}</s>→ ${w.left-1}</span>`:`${w.left} of ${w.total}`}</span></div>`;}).join("");
    }
    if(o.total>0){
      pay+=`${credits?`<div class="divider"></div>`:""}<div class="sublbl">${credits?`Pay the remaining ${aed(o.total)} with`:`Pay ${aed(o.total)} with`}</div>${payMethods()}<div class="hint">${I.shield} Processed by the payment gateway. Al Aweer never stores card details.</div>`;
    } else {
      pay+=`<div class="inline-note">${I.info}<span>Nothing to pay. Credits are held when you submit and used once the listing is approved.</span></div>`;
    }
  }
  main+=P("Payment",pay,{sub:credits?"Credits are used first. You only pay for what they don't cover.":"Pay per listing. Refunded if the listing fails review twice."});
  const cta=blocked?"Subscription required":o.total>0?`Pay ${aed(o.total)} & submit`:"Submit for review";
  const bar=`<button class="btn btn-ghost" data-act="cancel">Cancel</button><button class="btn btn-outline hide-sm" data-act="draft">Save as draft</button><span class="sp"></span><button class="btn btn-outline" data-act="back">${I.left} Back</button>
    <button class="btn btn-primary" data-act="submit"${blocked?" disabled":""}>${cta} ${blocked?"":I.right}</button>`;
  return shell("Review & publish","Review your listing, choose its visibility and submit. Listings are reviewed within 24 hours.",main,bar);

function validate(){
  const e={},c=S.car,p=S.plate;
  if(S.kind==="car"){
    if(S.step===1){if(!c.make)e["car.make"]="Choose a make";if(!c.model)e["car.model"]="Choose a model";if(!c.trim)e["car.trim"]="Choose a trim";if(!c.year)e["car.year"]="Choose a year";
      if(c.km==="")e["car.km"]="Enter the odometer reading";else if(+c.km>2000000)e["car.km"]="That looks too high";
      if(!c.specs)e["car.specs"]="Choose regional specs";if(!c.body)e["car.body"]="Choose a body type";
      if(!+c.price)e["car.price"]="Enter an asking price";else if(+c.price<1000)e["car.price"]="Price must be at least AED 1,000";}
    if(S.step===2){if(c.photos.length<MIN_PHOTOS)e["car.photos"]=`Add at least ${MIN_PHOTOS} photos (${c.photos.length} so far)`;if(carTitle().trim().length<10)e["car.title"]="Title should be at least 10 characters";if(!c.ext)e["car.ext"]="Choose the exterior colour";}
    if(S.step===3){if(!c.fuel)e["car.fuel"]="Choose a fuel type";if(!c.trans)e["car.trans"]="Choose a transmission";if(!c.steer)e["car.steer"]="Choose a steering side";}
  } else {
    if(S.step===1){if(!p.emirate)e["plate.emirate"]="Choose an emirate";if(!p.code)e["plate.code"]="Choose the plate code";if(!p.number)e["plate.number"]="Enter the plate number";else if(!/^[1-9]\d{0,4}$/.test(p.number))e["plate.number"]="Use 1 to 5 digits, not starting with 0";}
    if(S.step===2){if(!+p.price)e["plate.price"]="Enter an asking price";}
  }
  S.errors=e;return !Object.keys(e).length;
}
function autofill(){
  const c=S.car,p=S.plate;
  if(S.kind==="car"){
    if(S.step===1)Object.assign(c,{make:"Land Rover",model:"Defender",trim:"110 HSE",year:"2023",km:"60000",specs:"GCC",body:"SUV",price:"438000"});
    if(S.step===2){if(c.photos.length<MIN_PHOTOS)c.photos=[...SAMPLE];c.desc="Single owner, full agency service history. No accidents, original paint. Air suspension, 22-inch wheels and Meridian sound. Under dealer warranty until April 2027.";c.ext="Black";c.int="Brown";}
    if(S.step===3)Object.assign(c,{fuel:"Petrol",trans:"Automatic",steer:"Left hand",engine:"2,500 – 2,999 cc",hp:"300 – 399 HP",cyl:"6",doors:"5",seats:"5"});
    if(S.step===4){c.features.driving=["Adaptive cruise control","Lane keep assist","Parking sensors","360° camera"];c.features.safety=["ABS","Airbags","Emergency braking"];c.features.comfort=["Keyless entry","Push start","Climate control","Heated seats","Leather seats","Panoramic roof"];c.features.tech=["Navigation system","Apple CarPlay","Premium sound system"];
      if(dealer())c.finance.on=true;Object.assign(c.warranty,{on:true,source:dealer()?"Dealer":"Manufacturer",until:"2027-04"});}
  } else {
    if(S.step===1)Object.assign(p,{emirate:"Dubai",type:"Private car",code:"AA",number:"777"});
    if(S.step===2)Object.assign(p,{price:"185000",negotiable:true,desc:"Triple-seven Dubai plate. Transfer at RTA, buyer pays the transfer fee."});
  }
  S.errors={};render();toast("Sample data filled in");
}

/* ---------- Submit / pay ---------- */
const METHOD_NAME={saved:"Mastercard •••• 4821",apple:"Apple Pay",new:"Card"};
const dubaiNow=()=>new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Dubai",weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date());
function finish(paid){
  const o=order(),before={};if(S.wallet)pools().forEach(k=>before[k]=S.wallet[k].left);
  const ok=!paid||S.payOutcome==="success";
  if(ok)o.credits.forEach(l=>S.wallet[l.key].left--);
  const d=new Date(),ref=`AAM-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${Math.floor(1000+Math.random()*9000)}`;
  S.result={ok,ref,when:dubaiNow(),total:o.total,subtotal:o.subtotal,vat:o.vat,lines:o.lines,before,
    method:!paid?"Credits":(o.credits.length?METHOD_NAME[S.payMethod]+" + credits":METHOD_NAME[S.payMethod]),
    creditsText:o.credits.map(l=>`1 ${POOL_ONE[l.key]}`).join(", ")};
  go("result");
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="ovclose"&&e.target!==a)return;
  if(a.tagName==="A")e.preventDefault();
  const c=S.car;
  switch(act){
    case "restart":S.returnToReview=false;S.kind=null;S.car=blankCar();S.plate=blankPlate();S.opt="standard";S.modal=null;S.result=null;S.showColors={ext:false,int:false};go("start");break;
    case "kind":S.kind=a.dataset.kind;go("form",1);break;
    case "chip":{const path=a.dataset.path,v=a.dataset.val,keep=path==="plate.emirate"||path==="plate.type";setP(path,getP(path)===v&&!keep?"":v);if(path==="plate.emirate")S.plate.code="";delete S.errors[path];rerender();break;}
    case "morecolors":S.showColors[a.dataset.k]=true;rerender();break;
    case "toggle":setP(a.dataset.path,!getP(a.dataset.path));rerender();break;
    case "next":{if(!validate()){rerender();const f=document.querySelector(".errmsg");f&&f.scrollIntoView({block:"center",behavior:"smooth"});toast("Check the highlighted fields");break;}
      const last=S.kind==="car"?4:2;if(S.returnToReview||S.step>=last){S.returnToReview=false;go("checkout");}else go("form",S.step+1);break;}
    case "back":if(S.screen==="checkout")go("form",S.kind==="car"?4:2);else if(S.step>1)go("form",S.step-1);else go("start");break;
    case "draft":case "mdraft":S.modal=null;renderModal();toast("Draft saved to My listings › Drafts");break;
    case "cancel":S.modal={type:"cancel"};renderModal();break;
    case "changes":S.modal={type:"changes"};renderModal();break;
    case "autofill":autofill();break;
    case "addphoto":$("#file").click();break;
    case "samplephotos":c.photos=[...c.photos,...SAMPLE];delete S.errors["car.photos"];rerender();break;
    case "delphoto":{const i=+a.dataset.i;c.photos.splice(i,1);if(c.main>=c.photos.length)c.main=0;else if(i<c.main)c.main--;rerender();break;}
    case "mainphoto":c.main=+a.dataset.i;rerender();break;
    case "feat":S.modal={type:"feat",k:a.dataset.k,draft:[...c.features[a.dataset.k]]};renderModal();break;
    case "mfeat":{const d=S.modal.draft,v=a.dataset.val,i=d.indexOf(v);i>=0?d.splice(i,1):d.push(v);renderModal();break;}
    case "svc":{const k=a.dataset.k;if(c[k].on){c[k].on=false;rerender();}else{S.modal={type:k,draft:clone(c[k])};renderModal();}break;}
    case "svcedit":S.modal={type:a.dataset.k,draft:clone(c[a.dataset.k])};renderModal();break;
    case "msrc":S.modal.draft.source=a.dataset.val;renderModal();break;
    case "mclose":case "ovclose":closeModal(false);break;
    case "msave":closeModal(true);break;
    case "goto":S.returnToReview=S.screen==="checkout";go("form",+a.dataset.step);break;
    case "opt":S.opt=a.dataset.b;rerender();break;
    case "submit":{const o=order();S.processingPaid=o.total>0;go("processing");setTimeout(()=>finish(o.total>0),o.total>0?1300:900);break;}
    case "pm":S.payMethod=a.dataset.m;rerender();break;
    case "tocheckout":go("checkout");break;
    case "noop":toast("Not part of this prototype");break;
  }
});
function closeModal(save){
  const m=S.modal;if(!m)return;
  if(save&&m.type==="feat")S.car.features[m.k]=m.draft;
  if(save&&["finance","warranty","service"].includes(m.type)){
    if(m.type!=="finance"&&!m.draft.until){m.err="Choose the month it's valid until";renderModal();return;}
    if(m.type==="finance"){m.draft.dp=Math.min(90,Math.max(0,+m.draft.dp||0));m.draft.rate=Math.min(30,Math.max(0,+m.draft.rate||0));}
    S.car[m.type]={...m.draft,on:true};delete S.car[m.type].err;
  }
  S.modal=null;rerender();
}
function liveEmi(){const x=emi();const v=$("#emi-v");if(v)v.textContent=fmt(x.emi);}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.mbind){S.modal.draft[t.dataset.mbind]=t.value;if(S.modal.type==="finance")liveEmi();return;}
  const path=t.dataset.bind;if(!path||t.tagName==="SELECT")return;
  let v=t.value;
  if(t.dataset.num){const raw=digits(v).slice(0,10);setP(path,raw);const pos=t.value.length-t.selectionStart;t.value=raw?fmt(raw):"";const np=Math.max(0,t.value.length-pos);t.setSelectionRange(np,np);}
  else if(path==="plate.number"){v=digits(v).slice(0,5);t.value=v;setP(path,v);const st=$("#platestage");if(st)st.innerHTML=plateEl(S.plate)+plateTags(v);}
  else if(t.dataset.title){setP("car.title",v);S.car.titleEdited=true;$("#titlecount").textContent=`${v.length}/70 · suggested from your car details`;}
  else setP(path,v);
  if(path==="car.desc"){$("#desccount").textContent=`${v.length}/2000`;$("#desctip").textContent=v.trim().length<80?"Tip: listings with a description of 2–3 sentences get more enquiries.":"";}
  if(path==="plate.desc")$("#pdesccount").textContent=`${v.length}/1000`;
  if(S.errors[path]){delete S.errors[path];t.closest(".ctl")?.classList.remove("err");t.closest(".fld")?.querySelector(".errmsg")?.remove();}
  refreshSide();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.demo){const k=t.dataset.demo;S[k]=t.value;
    if(k==="scenario")S.wallet=clone(WALLETS[t.value]);
    if(k==="seller"){S.wallet=clone(WALLETS[S.scenario]);if(t.value!=="dealer"){S.car.finance.on=false;["warranty","service"].forEach(x=>{if(S.car[x].source==="Dealer")S.car[x].source="Manufacturer";});}S.opt="standard";if(S.screen==="result")S.screen="checkout";}
    rerender();toast(k==="scenario"?"Wallet updated":k==="seller"?`Viewing as ${t.value==="dealer"?"a dealer":"a customer"}`:"Payment result set");return;}
  if(t.dataset.mbind){S.modal.draft[t.dataset.mbind]=t.value;if(S.modal.type==="finance")liveEmi();if(S.modal.err){S.modal.err=null;renderModal();}return;}
  if(t.tagName==="SELECT"&&t.dataset.bind){const p=t.dataset.bind;setP(p,t.value);delete S.errors[p];if(p==="car.make"){S.car.model="";S.car.trim="";}if(p==="car.model")S.car.trim="";rerender();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.modal)closeModal(false);});
$("#file").addEventListener("change",e=>{
  const files=[...e.target.files].filter(f=>f.type.startsWith("image/")).slice(0,30);let n=files.length;if(!n)return;
  files.forEach(f=>{const r=new FileReader();r.onload=()=>{S.car.photos.push(r.result);if(--n===0){delete S.errors["car.photos"];rerender();toast(`${files.length} photo${files.length>1?"s":""} added`);}};r.readAsDataURL(f);});
  e.target.value="";
});
render();
</script>
